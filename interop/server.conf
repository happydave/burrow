port 1193
proto udp
dev tun0
topology p2p
server 10.88.0.0 255.255.255.0
ca /pki/ca.crt
cert /pki/server.crt
key /pki/server.key
dh /pki/dh.pem
tls-cipher DHE-RSA-AES256-SHA:@SECLEVEL=0
comp-lzo no
push "comp-lzo no"
keepalive 10 60
tun-mtu 1500
script-security 2
client-connect /etc/openvpn/allow.sh
verb 4
disable-dco
