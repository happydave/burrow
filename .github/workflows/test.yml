# Unit tests on Linux, macOS and Windows. The interop harness needs rootless
# podman and runs elsewhere (CLAUDE.md).
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Download modules (the licence gate reads them)
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Vet the interop harness (it needs Linux or macOS)
        if: runner.os != 'Windows'
        run: go vet -tags interop ./...
      - name: Test
        run: go test -count=1 -timeout 600s ./...
      - name: Test with the race detector
        if: runner.os == 'Linux'
        run: go test -count=1 -race -timeout 600s ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: ./...
      - name: Cross-builds
        run: |
          GOOS=windows go build ./...
          GOOS=darwin go build ./...
          GOOS=freebsd go build ./...
